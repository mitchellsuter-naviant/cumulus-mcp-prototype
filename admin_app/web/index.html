<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cumulus knowledge layer admin console.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cumulus Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- No webfont link here on purpose. Inter and JetBrains Mono are bundled as
       assets (see pubspec.yaml): CanvasKit draws text with Skia and never sees
       a face the browser loaded over CSS, so linking them fetched both
       families a second time for nothing. -->

  <title>Cumulus Knowledge Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Paint the canvas colour before Flutter boots so the first frame does
       not flash white-on-white. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F6F7F9;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
